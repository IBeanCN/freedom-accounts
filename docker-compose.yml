services:
  app:
    build: .
    ports:
      - "${FA_PORT:-8000}:8000"
    environment:
      FA_ENCRYPTION_KEY: ${FA_ENCRYPTION_KEY:?FA_ENCRYPTION_KEY is required}
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:-}
      FA_CDP_URL: http://browser:3000
      FA_HOST: "0.0.0.0"
      FA_JWT_SECRET: ${FA_JWT_SECRET:?FA_JWT_SECRET is required for non-local bind}
      FA_ADMIN_PASSWORD: ${FA_ADMIN_PASSWORD:?FA_ADMIN_PASSWORD is required for non-local bind}
    volumes:
      - app-data:/app/data
    depends_on:
      - browser
    restart: unless-stopped

  browser:
    image: browserless/chromium:latest
    environment:
      CONNECTION_TIMEOUT: "300000"
    # 指纹浏览器容器。默认 browserless/chromium 提供 CDP 连接（基础指纹通过
    # context_kwargs 下发）。如需 cloakserve 级别的 seed/timezone/proxy 参数
    # 透传，将 image 换为 cloakserve 镜像即可，其余配置不变。
    restart: unless-stopped

volumes:
  app-data:
